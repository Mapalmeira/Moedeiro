[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moedeiro"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "limits==5.8.0",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[project.scripts]
moedeiro = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
app = [
    "infrastructure/persistence/sqlite/registry/schema/*.sql",
    "infrastructure/persistence/sqlite/registry/schema/migrations/*.sql",
    "infrastructure/persistence/sqlite/ledger/schema/*.sql",
    "infrastructure/persistence/sqlite/ledger/schema/migrations/*.sql",
]

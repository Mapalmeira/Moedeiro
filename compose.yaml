services:
  moedeiro:
    image: mapalmeira/moedeiro:VERSION
    restart: on-failure

    ports:
      - "8080:8000"

    environment:
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be defined}"

    volumes:
      - type: bind
        source: /srv/moedeiro/registry
        target: /data/registry

      - type: bind
        source: /srv/moedeiro/ledgers
        target: /data/ledgers
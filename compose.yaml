services:
  backend:
    build:
      context: .
      dockerfile: backend/app/Containerfile
    image: moedeiro-backend:latest
    environment:
      REGISTRATION_IP_ATTEMPTS_RATE_LIMIT: ${REGISTRATION_IP_ATTEMPTS_RATE_LIMIT:-5/hour}
      LOGIN_IP_ATTEMPTS_RATE_LIMIT: ${LOGIN_IP_ATTEMPTS_RATE_LIMIT:-5/minute}
      PASSWORD_RECOVERY_IP_ATTEMPTS_RATE_LIMIT: ${PASSWORD_RECOVERY_IP_ATTEMPTS_RATE_LIMIT:-5/hour}
      TOTP_SETUP_IP_ATTEMPTS_RATE_LIMIT: ${TOTP_SETUP_IP_ATTEMPTS_RATE_LIMIT:-5/hour}
      SYNC_ROUTE_CONCURRENCY: ${SYNC_ROUTE_CONCURRENCY:-40}
      CREDENTIAL_OPERATION_CONCURRENCY: ${CREDENTIAL_OPERATION_CONCURRENCY:-8}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-2}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-200}
      MAX_CATEGORY_TREE_SIZE: ${MAX_CATEGORY_TREE_SIZE:-1000}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be defined}
    volumes:
      - registry_data:/data/registry
      - ledger_data:/data/ledgers

volumes:
  # Registry database sqlite file
  registry_data:

  # Directory containing the individual ledger sqlite databases.
  ledger_data:

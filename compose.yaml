services:
  backend:
    build:
      context: .
      dockerfile: backend/app/Containerfile
    image: moedeiro-backend:latest
    environment:
      REGISTRATION_VALIDATE_IP_RATE_LIMIT: ${REGISTRATION_VALIDATE_IP_RATE_LIMIT:-5/hour}
      REGISTRATION_CREATE_IP_RATE_LIMIT: ${REGISTRATION_CREATE_IP_RATE_LIMIT:-5/hour}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-5/minute}
      PASSWORD_RECOVERY_IP_RATE_LIMIT: ${PASSWORD_RECOVERY_IP_RATE_LIMIT:-5/hour}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-2}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be defined}
    volumes:
      - registry_data:/data/registry
      - ledger_data:/data/ledgers

volumes:
  # Registry database sqlite file
  registry_data:

  # Directory containing the individual ledger sqlite databases.
  ledger_data:

services:
  moedeiro:
    image: docker.io/mapalmeira/moedeiro:latest
    restart: on-failure

    ports:
      - "8080:8000"

    environment:
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be defined}"

    volumes:
      - type: bind
        source: "${HOME}/.local/share/moedeiro/registry"
        target: /data/registry

      - type: bind
        source: "${HOME}/.local/share/moedeiro/ledgers"
        target: /data/ledgers

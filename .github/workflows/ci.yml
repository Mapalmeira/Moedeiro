name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: npm test -- --reporters=json --output-file=vitest-results.json

      - name: Build frontend
        working-directory: frontend
        run: npm run build:production

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend
        run: python -m pip install --constraint ./backend/requirements.lock --editable './backend[test]'

      - name: Test backend
        id: backend
        continue-on-error: true
        working-directory: backend
        run: python -m unittest discover -s tests 2>&1 | tee test-results.txt

      - name: Test summary
        if: always()
        shell: bash
        run: |
          FRONTEND_TESTS=$(python -c "import json; print(json.load(open('frontend/vitest-results.json'))['numTotalTests'])" 2>/dev/null || echo "?")
          BACKEND_TESTS=$(grep -oP 'Ran \K\d+(?= tests)' backend/test-results.txt || echo "?")

          [ "${{ steps.frontend.outcome }}" = "success" ] && FRONTEND_STATUS="✅ Pass" || FRONTEND_STATUS="❌ Fail"
          [ "${{ steps.backend.outcome }}" = "success" ] && BACKEND_STATUS="✅ Pass" || BACKEND_STATUS="❌ Fail"

          if [[ "$FRONTEND_TESTS" =~ ^[0-9]+$ && "$BACKEND_TESTS" =~ ^[0-9]+$ ]]; then
            TOTAL=$((FRONTEND_TESTS + BACKEND_TESTS))
          else
            TOTAL="?"
          fi

          {
            echo "## Test Report"
            echo
            echo "| Suite | Status | Tests |"
            echo "| --- | --- | ---: |"
            echo "| Frontend | $FRONTEND_STATUS | $FRONTEND_TESTS |"
            echo "| Backend | $BACKEND_STATUS | $BACKEND_TESTS |"
            echo "| **Total** | | **$TOTAL** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check test result
        if: always()
        run: |
          [ "${{ steps.frontend.outcome }}" = "success" ] &&
          [ "${{ steps.backend.outcome }}" = "success" ]